<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" fill="none">
  <defs>
    <filter id="glowCyan3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glowWhite3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- Двойная звездная система сверху справа (по мотивам флага Slide 85) -->
  <g opacity="0.42">
    <circle cx="1160" cy="175" r="78" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <circle cx="1160" cy="175" r="64" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <circle cx="1160" cy="175" r="14" fill="#9E2A1C" />
    <circle cx="960" cy="275" r="56" stroke="#00C49A" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="960" cy="275" r="44" stroke="#00C49A" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="960" cy="275" r="10" fill="#9E2A1C" />
    <polygon points="1055,205 1075,216 1075,238 1055,249 1035,238 1035,216" stroke="#A855F7" stroke-width="1.5" />
    <polygon points="1072,218 1092,229 1092,251 1072,262 1052,251 1052,229" stroke="#A855F7" stroke-width="1.5" />
  </g>
  <!-- Созвездие слева внизу -->
  <g opacity="0.38">
    <polyline points="120,630 210,595 290,645 375,585" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="120" cy="630" r="3.5" fill="#00C49A" filter="url(#glowCyan3)" />
    <circle cx="210" cy="595" r="3" fill="#ffffff" />
    <circle cx="290" cy="645" r="4" fill="#ffffff" filter="url(#glowWhite3)" />
    <circle cx="375" cy="585" r="3.5" fill="#00C49A" filter="url(#glowCyan3)" />
  </g>
  <!-- Четырехконечные звезды со свечением -->
  <path d="M685 110 L689 122 L701 126 L689 130 L685 142 L681 130 L669 126 L681 122 Z" fill="#ffffff" opacity="0.75" filter="url(#glowWhite3)" />
  <path d="M1320 90 L1323 99 L1332 102 L1323 105 L1320 114 L1317 105 L1308 102 L1317 99 Z" fill="#00C49A" opacity="0.85" filter="url(#glowCyan3)" />
